---
# Template secrets for RAGaaS. DO NOT commit real secrets to git.
# Use sealed-secrets, SOPS, or external-secrets in production.
apiVersion: v1
kind: Secret
metadata:
  name: ragaas-secrets
  namespace: ragaas
  labels:
    app.kubernetes.io/name: ragaas
    app.kubernetes.io/part-of: ragaas-platform
type: Opaque
stringData:
  OPENAI_API_KEY: "<your-openai-api-key>"
  QDRANT_API_KEY: "<your-qdrant-api-key>"
  RAG_SERVICE_TOKEN: "<your-rag-service-token>"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: ragaas
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: ragaas-platform
type: Opaque
stringData:
  REDIS_PASSWORD: "<your-redis-password>"
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: ragaas
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: ragaas-platform
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: "rabbitmq"
  RABBITMQ_DEFAULT_PASS: "<your-rabbitmq-password>"
  RABBITMQ_ERLANG_COOKIE: "<your-erlang-cookie>"
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: ragaas
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: ragaas-platform
type: Opaque
stringData:
  MINIO_ROOT_USER: "minio"
  MINIO_ROOT_PASSWORD: "<your-minio-password>"
