---
# Template secrets for RAGaaS. DO NOT commit real secrets to git.
# Use sealed-secrets, SOPS or CI secret injection in production.
apiVersion: v1
kind: Secret
metadata:
	name: ragaas-secrets
	namespace: ragaas
type: Opaque
stringData:
	# Example placeholders — override with real values via CI or secrets manager
	OPENAI_API_KEY: ""
	QDRANT_API_KEY: ""
	REDIS_PASSWORD: ""
	RAG_SERVICE_TOKEN: ""

---
# RabbitMQ creds (example)
apiVersion: v1
kind: Secret
metadata:
	name: rabbitmq-credentials
	namespace: ragaas
type: Opaque
stringData:
	RABBITMQ_DEFAULT_USER: "guest"
	RABBITMQ_DEFAULT_PASS: "guest"
