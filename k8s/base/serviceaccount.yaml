---
# Redis Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-sa
  namespace: rag-system
  labels:
    app: redis
automountServiceAccountToken: false

---
# RabbitMQ Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq-sa
  namespace: rag-system
  labels:
    app: rabbitmq
automountServiceAccountToken: true  # Needed for K8s peer discovery

---
# Qdrant Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qdrant-sa
  namespace: rag-system
  labels:
    app: qdrant
automountServiceAccountToken: false

---
# RAG Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-service-sa
  namespace: rag-system
  labels:
    app: rag-service
automountServiceAccountToken: true

---
# Document Ingestor Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: document-ingestor-sa
  namespace: rag-system
  labels:
    app: document-ingestor
automountServiceAccountToken: false

---
# RBAC for RabbitMQ (K8s peer discovery)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rabbitmq-peer-discovery
  namespace: rag-system
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rabbitmq-peer-discovery
  namespace: rag-system
subjects:
  - kind: ServiceAccount
    name: rabbitmq-sa
    namespace: rag-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rabbitmq-peer-discovery

---
# Redis Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-sa
  namespace: rag-system
  labels:
    app: redis
automountServiceAccountToken: false