---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-service-sa
  namespace: ragaas
  labels:
    app.kubernetes.io/name: rag-service
    app.kubernetes.io/part-of: ragaas-platform
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-sa
  namespace: ragaas
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: ragaas-platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qdrant-sa
  namespace: ragaas
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: ragaas-platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq-sa
  namespace: ragaas
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: ragaas-platform
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio-sa
  namespace: ragaas
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: ragaas-platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: document-ingestor-sa
  namespace: ragaas
  labels:
    app.kubernetes.io/name: document-ingestor
    app.kubernetes.io/part-of: ragaas-platform
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rabbitmq-peer-discovery
  namespace: ragaas
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: ragaas-platform
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rabbitmq-peer-discovery
  namespace: ragaas
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: ragaas-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rabbitmq-peer-discovery
subjects:
  - kind: ServiceAccount
    name: rabbitmq-sa
    namespace: ragaas
