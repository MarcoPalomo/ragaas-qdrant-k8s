---
# Service accounts and minimal RBAC used by cluster components.
# Namespace is `ragaas` to match Helm/CD default. Adjust if your cluster uses a different namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-sa
  namespace: ragaas
  labels:
    app: redis
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq-sa
  namespace: ragaas
  labels:
    app: rabbitmq
automountServiceAccountToken: true

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qdrant-sa
  namespace: ragaas
  labels:
    app: qdrant
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-service-sa
  namespace: ragaas
  labels:
    app: rag-service
automountServiceAccountToken: true

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: document-ingestor-sa
  namespace: ragaas
  labels:
    app: document-ingestor
automountServiceAccountToken: false

---
# RBAC role for RabbitMQ peer discovery (if you use rabbitmq clustering that requires endpoints access)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rabbitmq-peer-discovery
  namespace: ragaas
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rabbitmq-peer-discovery
  namespace: ragaas
subjects:
  - kind: ServiceAccount
    name: rabbitmq-sa
    namespace: ragaas
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rabbitmq-peer-discovery