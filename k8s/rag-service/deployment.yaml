---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: ragaas
  labels:
    app.kubernetes.io/name: rag-service
    app.kubernetes.io/part-of: ragaas-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-service
        app.kubernetes.io/part-of: ragaas-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: rag-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: rag-service
          image: yourorg/rag-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: QDRANT_URL
              valueFrom:
                configMapKeyRef:
                  name: ragaas-config
                  key: QDRANT_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: ragaas-config
                  key: REDIS_URL
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: ragaas-config
                  key: RABBITMQ_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: ragaas-config
                  key: LOG_LEVEL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ragaas-secrets
                  key: OPENAI_API_KEY
            - name: RAG_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ragaas-secrets
                  key: RAG_SERVICE_TOKEN
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: rag-service
                topologyKey: kubernetes.io/hostname
