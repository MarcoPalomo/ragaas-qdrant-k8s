apiVersion: apps/v1
kind: Deployment
metadata:
	name: rag-service
	namespace: ragaas
	labels:
		app: rag-service
spec:
	replicas: 2
	selector:
		matchLabels:
			app: rag-service
	template:
		metadata:
			labels:
				app: rag-service
		spec:
			serviceAccountName: rag-service-sa
			containers:
				- name: rag-service
					image: yourorg/rag-service:latest
					imagePullPolicy: IfNotPresent
					ports:
						- containerPort: 8000
					env:
						- name: QDRANT_URL
							valueFrom:
								configMapKeyRef:
									name: ragaas-config
									key: QDRANT_URL
						- name: REDIS_URL
							valueFrom:
								configMapKeyRef:
									name: ragaas-config
									key: REDIS_URL
					readinessProbe:
						httpGet:
							path: /ready
							port: 8000
						initialDelaySeconds: 10
						periodSeconds: 5
					livenessProbe:
						httpGet:
							path: /health
							port: 8000
						initialDelaySeconds: 30
						periodSeconds: 10
					resources:
						requests:
							cpu: "100m"
							memory: "128Mi"
						limits:
							cpu: "500m"
							memory: "512Mi"
