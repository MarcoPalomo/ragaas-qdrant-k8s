---
# ClusterIssuer for Let's Encrypt Production
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: ragaas-platform
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@cnaas.link
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
---
# ClusterIssuer for Let's Encrypt Staging (for testing)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: ragaas-platform
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@cnaas.link
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - http01:
          ingress:
            class: nginx
---
# Certificate for RAG API
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rag-api-cert
  namespace: ragaas
  labels:
    app.kubernetes.io/name: rag-service
    app.kubernetes.io/part-of: ragaas-platform
spec:
  secretName: rag-api-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - rag-api.cnaas.link
  duration: 2160h
  renewBefore: 360h
---
# Certificate for RabbitMQ Management
