---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-worker
  namespace: ragaas
  labels:
    app.kubernetes.io/name: queue-worker
    app.kubernetes.io/part-of: ragaas-platform
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: queue-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: queue-worker
        app.kubernetes.io/part-of: ragaas-platform
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: rag-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: queue-worker
          image: ragaas/queue-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: ragaas-config
                  key: LOG_LEVEL
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: ragaas-config
                  key: RABBITMQ_URL
            - name: QDRANT_URL
              valueFrom:
                configMapKeyRef:
                  name: ragaas-config
                  key: QDRANT_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: ragaas-config
                  key: REDIS_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ragaas-secrets
                  key: OPENAI_API_KEY
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
