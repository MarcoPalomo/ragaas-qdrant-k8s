---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-ingestor
  namespace: ragaas
  labels:
    app.kubernetes.io/name: document-ingestor
    app.kubernetes.io/part-of: ragaas-platform
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: document-ingestor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-ingestor
        app.kubernetes.io/part-of: ragaas-platform
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: document-ingestor-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: document-ingestor
          image: ragaas/document-ingestor:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: ragaas-config
                  key: LOG_LEVEL
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: ragaas-config
                  key: RABBITMQ_URL
            - name: QDRANT_URL
              valueFrom:
                configMapKeyRef:
                  name: ragaas-config
                  key: QDRANT_URL
            - name: MINIO_ENDPOINT
              value: "minio:9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ragaas-secrets
                  key: OPENAI_API_KEY
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
