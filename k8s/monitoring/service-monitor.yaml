---
# ServiceMonitor for RAG Service
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rag-service-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: rag-service
    app.kubernetes.io/part-of: ragaas-platform
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-service
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - ragaas
