# ServiceMonitor resources for Prometheus Operator
# These define how Prometheus should scrape metrics from services

---
# ServiceMonitor for RAG Service
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rag-service-metrics
  namespace: rag-system
  labels:
    app: rag-service
    prometheus: rag-system
spec:
  selector:
    matchLabels:
      app: rag-service
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - rag-system

