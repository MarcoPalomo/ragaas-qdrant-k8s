---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: ragaas
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: ragaas-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
      protocol: TCP
    - name: management
      port: 15672
      targetPort: management
      protocol: TCP
    - name: metrics
      port: 15692
      targetPort: metrics
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: ragaas
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: ragaas-platform
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
      protocol: TCP
    - name: epmd
      port: 4369
      targetPort: 4369
      protocol: TCP
