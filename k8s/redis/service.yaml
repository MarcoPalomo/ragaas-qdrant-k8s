---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ragaas
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: ragaas-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
    - name: metrics
      port: 9121
      targetPort: metrics
      protocol: TCP
