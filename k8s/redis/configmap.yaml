---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: ragaas
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: ragaas-platform
data:
  redis.conf: |
    # Redis configuration
    bind 0.0.0.0
    port 6379

    # Persistence
    appendonly yes
    appendfsync everysec
    dir /data

    # Memory management
    maxmemory 512mb
    maxmemory-policy allkeys-lru

    # Security
    protected-mode no

    # Logging
    loglevel notice

    # Performance
    tcp-keepalive 300
    timeout 0
    tcp-backlog 511
