# Default values for document-ingestor
# Override per-environment in helmfile/values/<env>/document-ingestor.yaml

replicaCount: 2

image:
  repository: ragaas/document-ingestor
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Worker configuration
worker:
  # Number of concurrent document processing tasks
  concurrency: 4
  # Maximum retries for failed tasks
  maxRetries: 3
  # Retry delay in seconds
  retryDelay: 5
  # Task timeout in seconds
  taskTimeout: 300

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Environment variables
env:
  LOG_LEVEL: "INFO"
  DEBUG: "false"

# External service URLs (from ConfigMap)
config:
  qdrantUrl: "http://qdrant:6333"
  redisUrl: "redis://redis:6379"
  rabbitmqUrl: "amqp://rabbitmq:5672"
  minioEndpoint: "minio:9000"
  # Queue configuration
  ingestQueue: "document-ingest"
  deadLetterQueue: "document-ingest-dlq"

# Secrets reference
secrets:
  openaiApiKeySecret: "ragaas-secrets"
  openaiApiKeyKey: "OPENAI_API_KEY"

# Probes
probes:
  liveness:
    enabled: true
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Prometheus metrics
metrics:
  enabled: true
  port: 8000
  path: /metrics
  serviceMonitor:
    enabled: true
    interval: 30s
