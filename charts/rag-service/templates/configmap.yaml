apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rag-service.fullname" . }}-config
  namespace: {{ include "rag-service.namespace" . }}
  labels:
    {{- include "rag-service.labels" . | nindent 4 }}
data:
  QDRANT_URL: {{ .Values.config.qdrantUrl | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  RABBITMQ_URL: {{ .Values.config.rabbitmqUrl | quote }}
  MINIO_ENDPOINT: {{ .Values.config.minioEndpoint | quote }}
