# Default values for redis
# Override per-environment in helmfile/values/<env>/redis.yaml

replicaCount: 1

image:
  repository: redis
  tag: "7.2.4-alpine"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  fsGroup: 999

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 6379
  annotations: {}

persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 4Gi
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Redis configuration
config:
  # Maximum memory for Redis
  maxmemory: "256mb"
  # Eviction policy when memory is full
  maxmemoryPolicy: "allkeys-lru"
  # Append-only file persistence
  appendonly: "yes"
  # Save snapshots
  save: "900 1 300 10 60 10000"

# Authentication
auth:
  enabled: false
  existingSecret: ""
  existingSecretPasswordKey: "redis-password"

# Prometheus metrics
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
