apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redis.fullname" . }}-config
  namespace: {{ include "redis.namespace" . }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
data:
  redis.conf: |
    # Redis configuration file
    port {{ .Values.service.port }}
    bind 0.0.0.0

    # Memory management
    maxmemory {{ .Values.config.maxmemory }}
    maxmemory-policy {{ .Values.config.maxmemoryPolicy }}

    # Persistence
    dir /data
    appendonly {{ .Values.config.appendonly }}
    save {{ .Values.config.save }}

    # Logging
    loglevel notice

    # Security
    protected-mode no
    {{- if .Values.auth.enabled }}
    requirepass ${REDIS_PASSWORD}
    {{- end }}
