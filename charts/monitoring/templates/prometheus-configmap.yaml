{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monitoring.fullname" . }}-prometheus-config
  namespace: {{ include "monitoring.namespace" . }}
  labels:
    {{- include "monitoring.prometheus.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
      evaluation_interval: {{ .Values.prometheus.evaluationInterval }}

    alerting:
      alertmanagers:
        {{- if .Values.alertmanager.enabled }}
        - static_configs:
            - targets:
                - {{ include "monitoring.fullname" . }}-alertmanager:{{ .Values.alertmanager.service.port }}
        {{- else }}
        - static_configs:
            - targets: []
        {{- end }}

    rule_files: []

    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # RAG Service
      - job_name: 'rag-service'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ragaas
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
            regex: rag-service
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: http
            action: keep

      # Qdrant
      - job_name: 'qdrant'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ragaas
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
            regex: qdrant
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: http
            action: keep

      # Redis
      - job_name: 'redis'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ragaas
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
            regex: redis
            action: keep

      # RabbitMQ
      - job_name: 'rabbitmq'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ragaas
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
            regex: rabbitmq
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics
            action: keep

      {{- if .Values.prometheus.additionalScrapeConfigs }}
      {{ toYaml .Values.prometheus.additionalScrapeConfigs | nindent 6 }}
      {{- end }}
{{- end }}
