# Default values for queue-worker
# Override per-environment in helmfile/values/<env>/queue-worker.yaml

replicaCount: 2

image:
  repository: ragaas/queue-worker
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: "queue-worker-sa"
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Environment variables
env:
  LOG_LEVEL: "INFO"

# External service URLs (from ConfigMap)
config:
  qdrantUrl: "http://qdrant:6333"
  redisUrl: "redis://redis:6379"
  rabbitmqUrl: "amqp://rabbitmq:5672"

# Secrets reference
secrets:
  openaiApiKeySecret: "ragaas-secrets"
  openaiApiKeyKey: "OPENAI_API_KEY"

# Health probes (for worker, use exec probe)
probes:
  liveness:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
