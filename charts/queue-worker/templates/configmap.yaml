apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "queue-worker.fullname" . }}-config
  namespace: {{ include "queue-worker.namespace" . }}
  labels:
    {{- include "queue-worker.labels" . | nindent 4 }}
data:
  QDRANT_URL: {{ .Values.config.qdrantUrl | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  RABBITMQ_URL: {{ .Values.config.rabbitmqUrl | quote }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | default "INFO" | quote }}
