app:
  name: "ragaas-prod"
  environment: "production"
  debug: false

database:
  qdrant:
    host: "qdrant-service.ragaas.svc.cluster.local"
    port: 6333
    collection: "documents_prod"

llm:
  provider: "openai"
  model: "gpt-4"
  temperature: 0.1
  max_tokens: 2000

embeddings:
  model: "sentence-transformers/all-mpnet-base-v2"
  chunk_size: 1000
  chunk_overlap: 200

logging:
  level: "INFO"
  format: "json"

monitoring:
  enabled: true
  prometheus_port: 8000