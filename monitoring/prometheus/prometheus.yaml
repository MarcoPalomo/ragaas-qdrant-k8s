# Prometheus configuration for RAGaaS
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: ragaas
    env: '{{ .Values.environment | default "dev" }}'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Rule files
rule_files:
  - /etc/prometheus/rules/*.yaml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # RAG Service metrics
  - job_name: rag-service
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [ragaas]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
        regex: rag-service
        action: keep
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        regex: metrics
        action: keep

  # Document Ingestor metrics
  - job_name: document-ingestor
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [ragaas]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
        regex: document-ingestor
        action: keep
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        regex: metrics
        action: keep

  # Queue Worker metrics
  - job_name: queue-worker
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [ragaas]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
        regex: queue-worker
        action: keep
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        regex: metrics
        action: keep

  # Qdrant metrics
  - job_name: qdrant
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [ragaas]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
        regex: qdrant
        action: keep
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        regex: metrics
        action: keep

  # Redis metrics
  - job_name: redis
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [ragaas]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
        regex: redis
        action: keep
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        regex: metrics
        action: keep

  # RabbitMQ metrics
  - job_name: rabbitmq
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [ragaas]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
        regex: rabbitmq
        action: keep
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        regex: prometheus
        action: keep

  # Kubernetes pods (for all app metrics)
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [ragaas]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
