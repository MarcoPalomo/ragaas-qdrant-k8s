groups:
  - name: qdrant-alerts
    rules:
      # Qdrant Down
      - alert: QdrantDown
        expr: up{job="qdrant"} == 0
        for: 1m
        labels:
          severity: critical
          service: qdrant
        annotations:
          summary: "Qdrant is down"
          description: "Qdrant instance {{ $labels.instance }} has been down for more than 1 minute."
          runbook_url: "https://docs.ragaas.example.com/runbooks/qdrant-down"

      # High Memory Usage
      - alert: QdrantHighMemory
        expr: |
          container_memory_usage_bytes{container="qdrant"}
          / container_spec_memory_limit_bytes{container="qdrant"} > 0.85
        for: 5m
        labels:
          severity: warning
          service: qdrant
        annotations:
          summary: "Qdrant high memory usage"
          description: "Qdrant memory usage is at {{ $value | humanizePercentage }}."

      # Disk Space Low
      - alert: QdrantDiskSpaceLow
        expr: |
          (kubelet_volume_stats_available_bytes{persistentvolumeclaim=~".*qdrant.*"}
          / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~".*qdrant.*"}) < 0.2
        for: 10m
        labels:
          severity: warning
          service: qdrant
        annotations:
          summary: "Qdrant disk space low"
          description: "Qdrant has only {{ $value | humanizePercentage }} disk space remaining."

      # Disk Space Critical
      - alert: QdrantDiskSpaceCritical
        expr: |
          (kubelet_volume_stats_available_bytes{persistentvolumeclaim=~".*qdrant.*"}
          / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~".*qdrant.*"}) < 0.1
        for: 5m
        labels:
          severity: critical
          service: qdrant
        annotations:
          summary: "Qdrant disk space critical"
          description: "Qdrant has only {{ $value | humanizePercentage }} disk space remaining. Immediate action required."

      # High Search Latency
      - alert: QdrantHighSearchLatency
        expr: |
          histogram_quantile(0.95, sum(rate(qdrant_search_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
          service: qdrant
        annotations:
          summary: "Qdrant search latency high"
          description: "95th percentile search latency is {{ $value | humanizeDuration }}."

  - name: qdrant-recording-rules
    rules:
      # Total vectors
      - record: qdrant:vectors_total
        expr: sum(qdrant_collection_points_count)

      # Search rate
      - record: qdrant:search_rate:5m
        expr: sum(rate(qdrant_search_total[5m]))

      # P95 search latency
      - record: qdrant:search_latency_p95:5m
        expr: histogram_quantile(0.95, sum(rate(qdrant_search_duration_seconds_bucket[5m])) by (le))
