# Redis configuration for production
replicaCount: 1

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

persistence:
  enabled: true
  size: 10Gi

config:
  maxmemory: "512mb"
  maxmemoryPolicy: "allkeys-lru"
  appendonly: "yes"
  save: "900 1 300 10 60 10000"

auth:
  enabled: true
  existingSecret: ragaas-secrets
  existingSecretPasswordKey: REDIS_PASSWORD

metrics:
  enabled: true
  serviceMonitor:
    enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1
