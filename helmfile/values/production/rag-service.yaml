# RAG Service configuration for production
replicaCount: 3

image:
  repository: ghcr.io/your-org/ragaas-k8s/rag-service
  tag: ""  # Set via CI/CD
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

env:
  LOG_LEVEL: INFO
  QDRANT_URL: http://qdrant:6333
  REDIS_URL: redis://:$(REDIS_PASSWORD)@redis:6379
  RABBITMQ_URL: amqp://ragaas:$(RABBITMQ_PASSWORD)@rabbitmq:5672

probes:
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 15
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: ragaas.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ragaas-tls
      hosts:
        - ragaas.example.com

metrics:
  enabled: true
  serviceMonitor:
    enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 2

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rag-service
          topologyKey: kubernetes.io/hostname
