# Monitoring configuration for production
prometheus:
  enabled: true
  retention: 30d
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  persistence:
    enabled: true
    size: 100Gi

grafana:
  enabled: true
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  persistence:
    enabled: true
    size: 10Gi
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - grafana.ragaas.example.com
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.ragaas.example.com

alertmanager:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    receivers:
      - name: default
        slack_configs:
          - api_url: "$(SLACK_WEBHOOK_URL)"
            channel: "#alerts"
      - name: critical
        pagerduty_configs:
          - service_key: "$(PAGERDUTY_KEY)"
    route:
      receiver: default
      routes:
        - match:
            severity: critical
          receiver: critical
