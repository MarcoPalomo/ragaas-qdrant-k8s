# RabbitMQ configuration for development
replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

persistence:
  enabled: true
  size: 2Gi

auth:
  username: ragaas
  existingPasswordSecret: ragaas-secrets
  existingPasswordSecretKey: RABBITMQ_PASSWORD

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
