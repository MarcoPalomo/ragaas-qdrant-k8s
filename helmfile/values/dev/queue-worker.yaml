# Queue Worker configuration for development
replicaCount: 1

image:
  repository: ragaas/queue-worker
  tag: latest
  pullPolicy: Always

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false

env:
  LOG_LEVEL: DEBUG
  QDRANT_URL: http://qdrant:6333
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://ragaas:password@rabbitmq:5672

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
