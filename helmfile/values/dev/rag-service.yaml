# RAG Service configuration for development
replicaCount: 1

image:
  repository: ragaas/rag-service
  tag: latest
  pullPolicy: Always

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false

env:
  LOG_LEVEL: DEBUG
  QDRANT_URL: http://qdrant:6333
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://ragaas:password@rabbitmq:5672

probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
