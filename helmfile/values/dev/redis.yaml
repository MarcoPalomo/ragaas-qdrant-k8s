# Redis configuration for development
replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

persistence:
  enabled: true
  size: 1Gi

config:
  maxmemory: "128mb"
  maxmemoryPolicy: "allkeys-lru"

auth:
  enabled: false

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
