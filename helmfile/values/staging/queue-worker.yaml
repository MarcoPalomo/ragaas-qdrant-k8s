# Queue Worker configuration for staging
replicaCount: 2

image:
  repository: ghcr.io/your-org/ragaas-k8s/queue-worker
  tag: latest
  pullPolicy: Always

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  LOG_LEVEL: INFO
  QDRANT_URL: http://qdrant:6333
  REDIS_URL: redis://:$(REDIS_PASSWORD)@redis:6379
  RABBITMQ_URL: amqp://ragaas:$(RABBITMQ_PASSWORD)@rabbitmq:5672

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
