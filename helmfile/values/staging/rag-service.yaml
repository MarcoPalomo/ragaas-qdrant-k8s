# RAG Service configuration for staging
replicaCount: 2

image:
  repository: ghcr.io/your-org/ragaas-k8s/rag-service
  tag: latest
  pullPolicy: Always

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  LOG_LEVEL: INFO
  QDRANT_URL: http://qdrant:6333
  REDIS_URL: redis://:$(REDIS_PASSWORD)@redis:6379
  RABBITMQ_URL: amqp://ragaas:$(RABBITMQ_PASSWORD)@rabbitmq:5672

probes:
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 15
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 5

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: staging.ragaas.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ragaas-tls
      hosts:
        - staging.ragaas.example.com

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
