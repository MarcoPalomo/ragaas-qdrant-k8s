name: CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  CHART_PATH: ./charts/rag-service
  RELEASE_NAME: ragaas
  KUBE_NAMESPACE: ragaas

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        service: [rag-service, document-ingestor, batch-processing]
        include:
          - service: rag-service
            dockerfile: cicd/Dockerfile.rag-service
            context: ./src/rag-service
          - service: document-ingestor
            dockerfile: cicd/Dockerfile.ingestor
            context: ./src/document-ingestor
          - service: batch-processing
            dockerfile: src/batch-processing/Dockerfile
            context: ./src/batch-processing
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy:
    name: Deploy to Kubernetes
    needs: publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    
    environment:
      name: production
      url: https://ragaas.example.com  # Replace with your actual domain
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.3
      
      - name: Set up kubeconfig
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}
          context: default  # Replace with your cluster context
      
      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ env.KUBE_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
      
      - name: Deploy Qdrant
        run: |
          helm upgrade --install qdrant ./charts/qdrant \
            --namespace ${{ env.KUBE_NAMESPACE }} \
            --create-namespace \
            --wait
      
      - name: Deploy RAG service
        run: |
          helm upgrade --install ${{ env.RELEASE_NAME }} ${{ env.CHART_PATH }} \
            --namespace ${{ env.KUBE_NAMESPACE }} \
            --create-namespace \
            --set image.repository=${{ env.REGISTRY }}/${{ github.repository }}/rag-service \
            --set image.tag=${{ github.sha }} \
            --wait
      
      - name: Verify deployment
        run: |
          kubectl wait --for=condition=available --timeout=300s deployment/${{ env.RELEASE_NAME }} -n ${{ env.KUBE_NAMESPACE }}
          kubectl get all -n ${{ env.KUBE_NAMESPACE }}

  smoke-test:
    name: Run Smoke Tests
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests
      
      - name: Run smoke tests
        env:
          API_URL: https://ragaas.example.com  # Replace with your actual domain
        run: |
          # Add your smoke tests here
          curl -f ${API_URL}/health
          curl -f ${API_URL}/collections
