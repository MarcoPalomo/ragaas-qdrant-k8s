name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  KUBE_NAMESPACE: ragaas

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [rag-service, document-ingestor, queue-worker]
        include:
          - service: rag-service
            dockerfile: src/rag-service/Dockerfile
            context: ./src/rag-service
          - service: document-ingestor
            dockerfile: src/document-ingestor/Dockerfile
            context: ./src/document-ingestor
          - service: queue-worker
            dockerfile: src/rag-service/queue-worker/Dockerfile
            context: ./src/rag-service/queue-worker

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy-staging:
    name: Deploy to Staging
    needs: publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.ragaas.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Set up Helmfile
        run: |
          curl -fsSL -o helmfile https://github.com/helmfile/helmfile/releases/download/v0.162.0/helmfile_0.162.0_linux_amd64.tar.gz
          tar xzf helmfile -C /usr/local/bin
          chmod +x /usr/local/bin/helmfile

      - name: Set up kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_STAGING }}

      - name: Deploy with Helmfile
        run: |
          cd helmfile
          helmfile -e staging apply --set image.tag=${{ github.sha }}

      - name: Verify deployment
        run: |
          kubectl wait --for=condition=available --timeout=300s deployment/rag-service -n ${{ env.KUBE_NAMESPACE }}
          kubectl get all -n ${{ env.KUBE_NAMESPACE }}

  deploy-production:
    name: Deploy to Production
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://ragaas.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Set up Helmfile
        run: |
          curl -fsSL -o helmfile https://github.com/helmfile/helmfile/releases/download/v0.162.0/helmfile_0.162.0_linux_amd64.tar.gz
          tar xzf helmfile -C /usr/local/bin
          chmod +x /usr/local/bin/helmfile

      - name: Set up kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_PRODUCTION }}

      - name: Deploy with Helmfile
        run: |
          cd helmfile
          helmfile -e production apply --set image.tag=${{ github.ref_name }}

      - name: Verify deployment
        run: |
          kubectl wait --for=condition=available --timeout=300s deployment/rag-service -n ${{ env.KUBE_NAMESPACE }}
          kubectl get all -n ${{ env.KUBE_NAMESPACE }}

  smoke-test:
    name: Run Smoke Tests
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Run smoke tests
        env:
          API_URL: https://staging.ragaas.example.com
        run: |
          curl -f ${API_URL}/health || exit 1
          echo "Health check passed"
