stages:
  - lint
  - test
  - security
  - build
  - deploy-staging
  - deploy-production

variables:
  PYTHON_VERSION: "3.11"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  REGISTRY: $CI_REGISTRY
  KUBE_NAMESPACE: ragaas

# Cache pip packages between jobs
.python-cache: &python-cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}-pip
    paths:
      - .cache/pip
    policy: pull-push

# Lint Stage
lint:
  stage: lint
  image: python:${PYTHON_VERSION}-slim
  <<: *python-cache
  script:
    - pip install flake8 black isort mypy
    - black --check src/
    - isort --check-only src/
    - flake8 src/ --count --show-source --statistics --max-line-length=120
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

helm-lint:
  stage: lint
  image: alpine/helm:3.14.0
  script:
    - |
      for chart in charts/*/; do
        echo "Linting $chart"
        helm lint "$chart" || true
      done
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Test Stage
test:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  <<: *python-cache
  services:
    - name: qdrant/qdrant:v1.9.4
      alias: qdrant
    - name: redis:7.2-alpine
      alias: redis
  variables:
    QDRANT_URL: http://qdrant:6333
    REDIS_URL: redis://redis:6379
  script:
    - pip install pytest pytest-asyncio pytest-cov httpx
    - pip install -r src/rag-service/requirements.txt
    - pip install -r src/document-ingestor/requirements.txt
    - pip install -r src/rag-service/queue-worker/requirements.txt
    - pytest src/rag-service/tests/ -v --cov=src/rag-service/app --cov-report=xml --cov-report=html
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Security Stage
security:
  stage: security
  image: python:${PYTHON_VERSION}-slim
  <<: *python-cache
  script:
    - pip install bandit pip-audit
    - bandit -r src/ -ll -x "**/tests/*" -f json -o bandit-report.json || true
    - pip-audit -r src/rag-service/requirements.txt -f json -o pip-audit-report.json || true
  artifacts:
    paths:
      - bandit-report.json
      - pip-audit-report.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Build Stage
.build-template: &build-template
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      docker build \
        --cache-from $CI_REGISTRY_IMAGE/$SERVICE:latest \
        --tag $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA \
        --tag $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_REF_SLUG \
        --tag $CI_REGISTRY_IMAGE/$SERVICE:latest \
        --file $DOCKERFILE \
        $CONTEXT
    - docker push $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_REF_SLUG
    - docker push $CI_REGISTRY_IMAGE/$SERVICE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

build-rag-service:
  <<: *build-template
  variables:
    SERVICE: rag-service
    DOCKERFILE: src/rag-service/Dockerfile
    CONTEXT: ./src/rag-service

build-document-ingestor:
  <<: *build-template
  variables:
    SERVICE: document-ingestor
    DOCKERFILE: src/document-ingestor/Dockerfile
    CONTEXT: ./src/document-ingestor

build-queue-worker:
  <<: *build-template
  variables:
    SERVICE: queue-worker
    DOCKERFILE: src/rag-service/queue-worker/Dockerfile
    CONTEXT: ./src/rag-service/queue-worker

# Deploy Stage - Staging
deploy-staging:
  stage: deploy-staging
  image: alpine/helm:3.14.0
  environment:
    name: staging
    url: https://staging.ragaas.example.com
  before_script:
    - apk add --no-cache curl
    - curl -fsSL https://github.com/helmfile/helmfile/releases/download/v0.162.0/helmfile_0.162.0_linux_amd64.tar.gz | tar xz -C /usr/local/bin
    - chmod +x /usr/local/bin/helmfile
  script:
    - cd helmfile
    - helmfile -e staging apply --set image.tag=$CI_COMMIT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Deploy Stage - Production
deploy-production:
  stage: deploy-production
  image: alpine/helm:3.14.0
  environment:
    name: production
    url: https://ragaas.example.com
  before_script:
    - apk add --no-cache curl
    - curl -fsSL https://github.com/helmfile/helmfile/releases/download/v0.162.0/helmfile_0.162.0_linux_amd64.tar.gz | tar xz -C /usr/local/bin
    - chmod +x /usr/local/bin/helmfile
  script:
    - cd helmfile
    - helmfile -e production apply --set image.tag=$CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG
  when: manual
